server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los puntos de entrada de la PWA deben comprobarse en cada visita.
    location ~ ^/(index\.html|manifest\.json|sw\.js|version\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Solo los recursos con nombre versionado reciben caché prolongada.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # Vue Router usa hash; un archivo inexistente debe responder 404.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
