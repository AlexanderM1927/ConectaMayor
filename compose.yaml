name: conectamayor

services:
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-9001}:9000"
    volumes:
      - ./front:/usr/src/front-app
      - frontend_node_modules:/usr/src/front-app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    init: true

volumes:
  frontend_node_modules:
